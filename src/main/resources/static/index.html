<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANTX URL Shortener</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #333;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #444;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f1f5f9;
        }

        .result h3 {
            margin-bottom: 12px;
        }

        .short-url {
            word-break: break-all;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .copy-btn {
            width: 100%;
            margin-top: 5px;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
        }

        .loading {
            display: none;
            margin-top: 15px;
            text-align: center;
            color: #666;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ANTX URL Shortener</h1>

    <p class="subtitle">
        Convert long URLs into short, shareable links
    </p>

    <label for="urlInput">Enter your URL</label>

    <div class="input-row">
        <input
            type="url"
            id="urlInput"
            placeholder="https://example.com"
        >

        <button onclick="shortenUrl()">
            Shorten
        </button>
    </div>

    <div class="loading" id="loading">
        Creating short URL...
    </div>

    <div class="error" id="error">
        Something went wrong.
    </div>

    <div class="result" id="result">

        <h3>Your Short URL</h3>

        <div class="short-url" id="shortUrl"></div>

        <button class="copy-btn" onclick="copyUrl()">
            Copy Short URL
        </button>

    </div>

    <footer>
        ANTX URL Shortener
    </footer>

</div>


<script>

async function shortenUrl() {

    const input = document.getElementById("urlInput");
    const url = input.value.trim();

    const result = document.getElementById("result");
    const error = document.getElementById("error");
    const loading = document.getElementById("loading");
    const shortUrl = document.getElementById("shortUrl");

    result.style.display = "none";
    error.style.display = "none";

    if (!url) {
        error.innerText = "Please enter a URL.";
        error.style.display = "block";
        return;
    }

    loading.style.display = "block";

    try {

        const response = await fetch("/api/shorten", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                originalUrl: url
            })

        });

        if (!response.ok) {
            throw new Error("Failed to shorten URL");
        }

        const data = await response.json();

        const generatedUrl =
            window.location.origin +
            "/api/" +
            data.shortCode;

        shortUrl.innerHTML =
            `<a href="${generatedUrl}" target="_blank">
                ${generatedUrl}
            </a>`;

        result.style.display = "block";

    } catch (err) {

        error.innerText =
            "Unable to create short URL. Please try again.";

        error.style.display = "block";

    } finally {

        loading.style.display = "none";
    }
}


async function copyUrl() {

    const shortUrlElement =
        document.querySelector("#shortUrl a");

    if (!shortUrlElement) {
        return;
    }

    await navigator.clipboard.writeText(
        shortUrlElement.href
    );

    const button =
        document.querySelector(".copy-btn");

    button.innerText = "Copied!";

    setTimeout(() => {
        button.innerText = "Copy Short URL";
    }, 2000);
}

</script>

</body>
</html>
